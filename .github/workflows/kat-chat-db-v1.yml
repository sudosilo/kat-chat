name: Kat Chat database rooms

# Applies the rooms change (Field Chat) to the Kat Chat Supabase project when it changes.
on:
  push:
    branches: [master]
    paths: ['supabase/chat-rooms.sql', '.github/workflows/kat-chat-db-v1.yml']
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply rooms
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e
          [ -n "$TOKEN" ] || { echo "SUPABASE_ACCESS_TOKEN secret is not set"; exit 1; }
          jq -Rs '{query: .}' supabase/chat-rooms.sql > body.json
          out=$(curl -s -w '\n%{http_code}' -X POST https://api.supabase.com/v1/projects/vogxdikogfaxhwcgajfg/database/query -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary @body.json)
          echo "$out"
          [ "$(echo "$out" | tail -n1)" -lt 300 ]
